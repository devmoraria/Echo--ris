<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Iris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Echo Iris</h1>
    <p class="subtitle">áudio → visual 3D → inteligência</p>
  </header>

  <main class="layout">

    <!-- PLAYER -->
    <section class="panel player-panel">
      <h2>Player</h2>

      <audio id="audio-el" src="assets/we-on-go-lyrics.mp3">
        Seu navegador não suporta áudio.
      </audio>

      <div class="player-controls">
        <input type="file" id="file-input" accept="audio/*">
        <button id="play-btn" disabled>▶ Play</button>
        <button id="pause-btn" disabled>⏸ Pause</button>
      </div>

      <div class="audio-meter">
        <span>bass: <b id="val-bass">0</b></span>
        <span>mid: <b id="val-mid">0</b></span>
        <span>treble: <b id="val-treble">0</b></span>
        <span>volume: <b id="val-volume">0</b></span>
        <span>cor (hue): <b id="val-hue">-</b></span>
        <span>batida: <b id="val-beat">-</b></span>
        <span>voz/palavra: <b id="val-voice">-</b></span>
        <span>tic: <b id="val-tic">-</b></span>
      </div>

      <div class="settings-panel">
        <h3>Personalização</h3>

        <div class="setting-row">
          <label for="set-speed">Velocidade <span id="set-speed-val">1.0x</span></label>
          <input type="range" id="set-speed" min="0.5" max="2" step="0.1">
        </div>

        <div class="setting-row">
          <label for="set-beat">Intensidade da batida <span id="set-beat-val">1.0x</span></label>
          <input type="range" id="set-beat" min="0.3" max="2" step="0.1">
        </div>

        <div class="setting-row">
          <label for="set-smoke">Quantidade de fumaça <span id="set-smoke-val">1.0x</span></label>
          <input type="range" id="set-smoke" min="0" max="1.5" step="0.1">
        </div>

        <div class="setting-row">
          <label for="set-vibe">Identidade da faixa vs. energia ao vivo <span id="set-vibe-val">75%</span></label>
          <input type="range" id="set-vibe" min="0" max="1" step="0.05">
        </div>

        <div class="setting-row setting-row-toggle">
          <label for="set-bloom">Brilho (bloom)</label>
          <input type="checkbox" id="set-bloom">
        </div>

        <div class="setting-row setting-row-toggle">
          <label for="set-shake">Shake de câmera na batida</label>
          <input type="checkbox" id="set-shake">
        </div>

        <button id="set-reset" type="button">Restaurar padrão</button>
      </div>
    </section>

    <!-- CANVAS 3D -->
    <section class="panel canvas-panel">
      <h2>Visual 3D</h2>
      <canvas id="scene-canvas"></canvas>
    </section>

    <!-- CHAT -->
    <section class="panel chat-panel">
      <h2>Assistente</h2>
      <div id="chat-log" class="chat-log">
        <p class="chat-placeholder">Pergunte algo sobre o projeto...</p>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Pergunte algo sobre a música..." disabled>
        <button id="chat-send" disabled>Enviar</button>
      </div>
    </section>

  </main>

  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <!-- Módulos de pós-processamento pra bloom (brilho) real nas estrelas.
       São builds legadas (examples/js), compatíveis com o build não-modular
       do three.min.js acima — scene3d.js já cai num fallback sem bloom se
       algum desses não carregar (ex.: sem internet/CDN bloqueado). -->
  <script src="https://unpkg.com/three@0.152.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="script.js"></script>
  <script src="settings.js"></script>
  <script src="scene3d.js"></script>
  <script src="chat.js"></script>
</body>
</html>
